name: 🧪 Rust verification
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            features: ""
          - toolchain: stable
            features: "--all-features"
          - toolchain: "1.85.0"
            features: "--all-features"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} check --workspace ${{ matrix.features }} --locked
      - run: cargo +${{ matrix.toolchain }} test --workspace ${{ matrix.features }} --locked
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets ${{ matrix.features }} --locked -- -D warnings
  live-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup update stable && rustup default stable
      - run: cargo test --workspace --all-features --locked
      - run: cargo install --path crates/ruvoraq-cli --features postgres --locked --force
      - run: cargo check --manifest-path examples/app/Cargo.toml --all-features --locked
      - run: python3 examples/app/tests/full_test.py --postgres
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov -p ruvoraq-web --test middleware --json --output-path target/middleware-coverage.json
      - run: python3 scripts/check_middleware_coverage.py target/middleware-coverage.json
