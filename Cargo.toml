[workspace]
members = ["crates/ruvoraq", "crates/ruvoraq-web", "crates/ruvoraq-macros", "crates/ruvoraq-cli", "crates/ruvoraq-config", "crates/ruvoraq-db"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/babar-xagi/Ruvoraq"
homepage = "https://github.com/babar-xagi/Ruvoraq"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "signal"] }
toml = "1.1.6"
inventory = "0.3.24"
syn = { version = "3.0.6", features = ["full"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
schemars = "1.2.2"
