[package]
name = "ruvoraq-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ruvoraq optional SQLite connection pool"
publish = false

[dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
