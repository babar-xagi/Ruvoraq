[package]
name = "ruvoraq-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional SQLite and PostgreSQL adapters with checked transactional migrations for Ruvoraq"
publish = ["crates-io"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ruvoraq", "backend", "web", "api"]
categories = ["web-programming::http-server", "development-tools"]

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring"]

[dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "migrate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
